<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- Dryckeslexikon, ljus design (design B). Allt viktigt ligger inom cirkeln r=400 kring mitten, så Android kan beskära ikonen (maskable). -->
 <defs>
  <pattern id="prick" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="24" cy="24" r="4" fill="#141414" opacity=".09"/></pattern>
  <g id="vinglas">
   <path d="M0 0h230c10 130-28 250-115 256C28 250-10 130 0 0z"/>
   <rect x="96" y="250" width="38" height="200" rx="8"/>
   <ellipse cx="115" cy="458" rx="105" ry="28"/>
  </g>
  <g id="mugg">
   <path d="M228 90h40c62 0 92 40 92 105v70c0 65-30 105-92 105h-40z M228 150v160h34c30 0 40-20 40-55v-50c0-35-10-55-40-55z" fill-rule="evenodd"/>
   <rect x="0" y="40" width="250" height="380" rx="34"/>
  </g>
 </defs>
 <rect width="1024" height="1024" fill="#fff6e5"/>
 <rect width="1024" height="1024" fill="url(#prick)"/>
 <!-- skuggor -->
 <g fill="#141414" transform="translate(18 18)">
  <use href="#vinglas" transform="translate(200 292) rotate(-12 115 230)"/>
  <use href="#mugg" transform="translate(452 300)"/>
  <rect x="610" y="610" width="170" height="170" rx="30" transform="rotate(14 695 695)"/>
 </g>
 <!-- vinglas -->
 <g transform="translate(200 292) rotate(-12 115 230)" stroke="#141414" stroke-width="22" stroke-linejoin="round">
  <use href="#vinglas" fill="#fff"/>
  <path d="M8 95h214c-6 95-45 150-107 155C52 245 14 190 8 95z" fill="#e2475f" stroke="none"/>
  <path d="M0 0h230c10 130-28 250-115 256C28 250-10 130 0 0z" fill="none"/>
  <path d="M8 95h214" fill="none" stroke-width="14"/>
  <path d="M50 120c4 50 16 80 36 100" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" opacity=".7"/>
 </g>
 <!-- ölsejdel -->
 <g transform="translate(452 300)" stroke="#141414" stroke-width="22" stroke-linejoin="round">
  <use href="#mugg" fill="#ffd23f"/>
  <path d="M60 140v220M125 140v220M190 140v220" stroke="#e8a20c" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M-20 70c-20-60 40-95 80-70 20-55 105-55 125 0 40-25 110 5 90 70 30 20 15 75-25 70H5c-40 5-55-50-25-70z" fill="#fff"/>
  <circle cx="95" cy="240" r="13" fill="#fff" stroke="none" opacity=".85"/><circle cx="150" cy="300" r="9" fill="#fff" stroke="none" opacity=".85"/><circle cx="85" cy="330" r="7" fill="#fff" stroke="none" opacity=".85"/>
 </g>
 <!-- tärning -->
 <g transform="rotate(14 695 695)" stroke="#141414" stroke-width="20">
  <rect x="610" y="610" width="170" height="170" rx="30" fill="#fff"/>
  <g fill="#141414" stroke="none"><circle cx="652" cy="652" r="17"/><circle cx="695" cy="695" r="17"/><circle cx="738" cy="738" r="17"/></g>
 </g>
</svg>
